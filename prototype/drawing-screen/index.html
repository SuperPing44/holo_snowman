<!doctype html>
<!--
  PROTOTYPE — throwaway, never merge into dev/main.
  Question (wayfinder ticket #6): How should the Visitor drawing screen look and behave?
  Plan: three structurally different variants of the Visitor drawing screen in one file,
  switchable via ?variant=A|B|C, the bottom pill, or the ← / → keys. The Design is kept
  when switching, so you can compare the same snowman in every layout.
  Extra params: ?idle=<seconds> (default 45) for the idle reset.
  Run: double-click this file (Chrome/Edge). Pen pressure shows in the state panel (bottom left).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · Drawing screen</title>
<style>
  :root { --bg:#20242b; --panel:#2d323b; --panel2:#373d48; --text:#eef1f5; --muted:#9aa4b2; --accent:#4fc3f7; --done:#43a047; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,"Segoe UI",sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  button { font:inherit; color:inherit; background:var(--panel2); border:2px solid transparent; border-radius:12px; cursor:pointer; touch-action:manipulation; }
  button.active { border-color:var(--accent); background:#1f4a5e; }
  #app { position:absolute; inset:0 0 52px 0; }
  .host { position:relative; overflow:hidden; }
  .host canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  .swatch { border-radius:50%; border:3px solid rgba(255,255,255,.15); }
  .swatch.active { border-color:#fff; box-shadow:0 0 0 3px var(--accent); }
  .stk { font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif; }

  /* ---------- Variant A: toolbar & trays ---------- */
  .vA { display:grid; grid-template-columns:104px 1fr 260px; grid-template-rows:56px 1fr; height:100%; }
  .vA header { grid-column:1/4; display:flex; align-items:center; padding:0 20px; background:var(--panel); font-size:20px; font-weight:600; }
  .vA .rail { background:var(--panel); padding:10px; display:flex; flex-direction:column; gap:8px; align-items:center; overflow:auto; }
  .vA .rail .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:6px; }
  .vA .rail button { width:72px; min-height:44px; font-size:14px; }
  .vA .rail .swatch { width:40px; height:40px; min-height:0; }
  .vA .colors { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .vA .tray { background:var(--panel); padding:14px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
  .vA .tray h3 { margin:6px 0 0; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .vA .tray .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .vA .tray .grid button { font-size:28px; aspect-ratio:1; }
  .vA .tray .done { margin-top:auto; background:var(--done); font-size:20px; font-weight:700; padding:16px; }

  /* ---------- Variant B: big-button kid mode ---------- */
  .vB { position:relative; height:100%; }
  .vB .host { position:absolute; inset:0; }
  .vB .topl { position:absolute; top:16px; left:16px; display:flex; gap:12px; }
  .vB .topl button { width:72px; height:72px; border-radius:50%; font-size:30px; }
  .vB .done { position:absolute; top:16px; right:16px; height:72px; padding:0 34px; border-radius:36px; background:var(--done); font-size:26px; font-weight:800; }
  .vB .dock { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:12px; align-items:center; background:rgba(45,50,59,.95); padding:12px 18px; border-radius:48px; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  .vB .dock .swatch { width:60px; height:60px; }
  .vB .dock .sep { width:2px; height:48px; background:#4a5160; }
  .vB .dock .round { width:64px; height:64px; border-radius:50%; font-size:28px; }
  .vB .dock .sz { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; padding:0; }
  .vB .dock .sz i { display:block; background:#fff; border-radius:50%; }
  .vB .dock .big { height:64px; padding:0 22px; border-radius:32px; font-size:22px; font-weight:700; background:#5e35b1; }
  .vB .drawer { position:absolute; left:0; right:0; bottom:0; background:var(--panel); border-radius:28px 28px 0 0; padding:20px 24px 28px; transform:translateY(105%); transition:transform .28s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 40px rgba(0,0,0,.5); }
  .vB .drawer.open { transform:translateY(0); }
  .vB .drawer .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:22px; font-weight:700; }
  .vB .drawer .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px; }
  .vB .drawer .grid button { font-size:44px; height:84px; }

  /* ---------- Variant C: guided steps ---------- */
  .vC { display:grid; grid-template-rows:84px 1fr auto 88px; height:100%; }
  .vC .steps { display:flex; justify-content:center; gap:10px; align-items:center; background:var(--panel); padding:0 12px; }
  .vC .steps button { display:flex; align-items:center; gap:10px; padding:10px 18px; font-size:18px; border-radius:30px; background:transparent; color:var(--muted); }
  .vC .steps button b { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--panel2); color:var(--text); }
  .vC .steps button.active { color:var(--text); background:#1f4a5e; }
  .vC .steps button.active b { background:var(--accent); color:#000; }
  .vC .steps button.past b { background:var(--done); }
  .vC .prompt { position:absolute; top:14px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:8px 18px; border-radius:20px; font-size:20px; pointer-events:none; }
  .vC .strip { display:flex; gap:14px; align-items:center; justify-content:center; padding:10px; background:var(--panel); flex-wrap:wrap; }
  .vC .strip .seg { display:flex; background:var(--panel2); border-radius:14px; padding:4px; }
  .vC .strip .seg button { background:transparent; padding:10px 18px; font-size:17px; }
  .vC .strip .seg button.active { background:#1f4a5e; }
  .vC .strip .swatch { width:46px; height:46px; }
  .vC .strip .stk { font-size:34px; width:62px; height:62px; }
  .vC .strip .small { padding:10px 14px; font-size:16px; }
  .vC .nav { display:flex; justify-content:space-between; align-items:center; padding:0 20px; gap:20px; }
  .vC .nav button { height:64px; padding:0 40px; font-size:22px; font-weight:700; border-radius:32px; }
  .vC .nav .next { background:var(--accent); color:#000; }
  .vC .nav .finish { background:var(--done); color:#fff; }

  /* ---------- shared overlays ---------- */
  #stbar { position:fixed; display:none; gap:4px; background:rgba(20,22,26,.92); padding:6px; border-radius:14px; transform:translate(-50%,0); z-index:5; }
  #stbar button { width:44px; height:44px; font-size:20px; padding:0; }
  #overlay { position:fixed; inset:0; display:none; place-items:center; background:rgba(10,12,16,.82); z-index:20; text-align:center; font-size:34px; font-weight:700; }
  #overlay small { display:block; font-size:20px; font-weight:400; color:var(--muted); margin-top:12px; }
  #switcher { position:fixed; left:50%; bottom:8px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; background:#ffeb3b; color:#111; border-radius:20px; padding:4px 6px; font:600 14px system-ui; box-shadow:0 4px 18px rgba(0,0,0,.5); z-index:30; }
  #switcher button { background:#111; color:#ffeb3b; border:0; width:30px; height:30px; border-radius:50%; padding:0; }
  #switcher span { padding:0 10px; white-space:nowrap; }
  #debug { position:fixed; left:8px; bottom:8px; font:11px/1.45 ui-monospace,Consolas,monospace; color:#b8c1cc; background:rgba(0,0,0,.55); padding:6px 8px; border-radius:8px; z-index:30; white-space:pre; pointer-events:none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="stbar">
  <button data-st="smaller" title="Smaller">➖</button>
  <button data-st="bigger" title="Bigger">➕</button>
  <button data-st="rotl" title="Rotate left">↺</button>
  <button data-st="rotr" title="Rotate right">↻</button>
  <button data-st="del" title="Delete">🗑</button>
</div>
<div id="overlay"></div>
<div id="switcher"><button id="prev">◀</button><span id="vlabel"></span><button id="next">▶</button></div>
<div id="debug"></div>

<script>
/* ======================= Template geometry (design units, from Sketch.png) ======================= */
const SURFACES = [
  { id:'hat',   name:'Hat Panel',       poly:[[527,158],[882,162],[880,517],[523,513]] },
  { id:'armL',  name:'Left Arm Panel',  poly:[[92,634],[527,882],[475,975],[38,727]] },
  { id:'armR',  name:'Right Arm Panel', poly:[[888,882],[1322,634],[1375,727],[940,975]] },
  { id:'base',  name:'Base',  c:[695,1530], r:342 },
  { id:'torso', name:'Torso', c:[707,995],  r:252 },
  { id:'head',  name:'Head',  c:[705,585],  r:162 },
];
const FULL = [30,150,1385,1880];
const COLORS = ['#111111','#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#6d4c41'];
const SIZES = [6,14,30];
const STICKERS = {
  face:    ['👀','👁️','🥕','👄','😊','😎','🙂','👃'],
  hat:     ['🎩','🧢','👒','🎓','👑','⛑️','💇','🎀'],
  arms:    ['🧤','🌿','🧹','🪵','✋','🍭'],
  clothes: ['🧣','🔴','⚫','⭐','❄️','👔','❤️','🎄'],
};
const ALL_STICKERS = Object.values(STICKERS).flat();
const STEPS = [
  { name:'Face',        cat:'face',    bbox:[520,400,890,770],  prompt:'Give the snowman a face!' },
  { name:'Hat or hair', cat:'hat',     bbox:[500,140,905,770],  prompt:'Draw a hat or some hair' },
  { name:'Arms',        cat:'arms',    bbox:[20,600,1395,1010], prompt:'Decorate the arms' },
  { name:'Clothes',     cat:'clothes', bbox:[330,720,1060,1890],prompt:'Dress it up: scarf, buttons, …' },
  { name:'Done',        cat:null,      bbox:FULL,               prompt:'Looks great? Press Finish!' },
];
const VARIANTS = { A:'Toolbar & trays', B:'Big-button kid mode', C:'Guided steps' };

/* ======================= State ======================= */
const params = new URLSearchParams(location.search);
const IDLE = +(params.get('idle') || 45);
const S = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'A',
  mode:'draw', tool:'pen', color:COLORS[0], size:SIZES[1],
  strokes:[], stickers:[], selected:-1, pendingSticker:null, history:[],
  step:0, drawerOpen:false, lastPointer:{type:'-', pressure:0}, lastInput:Date.now(), idleWarn:false,
};
let cv, ctx, layer, lctx, mask, mctx, host, view = {s:1,ox:0,oy:0}, dpr = 1, chrome = null;

function snapshot(){ S.history.push(JSON.stringify({strokes:S.strokes, stickers:S.stickers})); if (S.history.length>60) S.history.shift(); }
function undo(){ const h=S.history.pop(); if(!h) return; const d=JSON.parse(h); S.strokes=d.strokes; S.stickers=d.stickers; S.selected=-1; render(); }
function resetDesign(){ S.strokes=[]; S.stickers=[]; S.history=[]; S.selected=-1; S.pendingSticker=null; S.mode='draw'; S.tool='pen'; S.step=0; S.drawerOpen=false; build(); }
const isEmpty = () => !S.strokes.length && !S.stickers.length;

/* ======================= Rendering ======================= */
function surfPath(c,s){ if(s.poly){ c.moveTo(...s.poly[0]); s.poly.slice(1).forEach(p=>c.lineTo(...p)); c.closePath(); } else { c.moveTo(s.c[0]+s.r,s.c[1]); c.arc(s.c[0],s.c[1],s.r,0,Math.PI*2); } }
function setT(c){ c.setTransform(view.s,0,0,view.s,view.ox,view.oy); }
function currentBBox(){ return S.variant==='C' ? STEPS[S.step].bbox : FULL; }
function fit(){
  if(!host) return;
  dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, host.clientWidth*dpr|0), H = Math.max(1, host.clientHeight*dpr|0);
  for (const c of [cv,layer,mask]) { c.width=W; c.height=H; }
  const [x0,y0,x1,y1]=currentBBox(), bw=x1-x0, bh=y1-y0, pad=20*dpr;
  const s=Math.min((W-2*pad)/bw,(H-2*pad)/bh);
  view={ s, ox:(W-bw*s)/2-x0*s, oy:(H-bh*s)/2-y0*s };
  mctx.setTransform(1,0,0,1,0,0); mctx.clearRect(0,0,W,H); setT(mctx); mctx.fillStyle='#fff';
  for (const s2 of SURFACES){ mctx.beginPath(); surfPath(mctx,s2); mctx.fill(); }
  render();
}
function drawStroke(c,st){
  c.save(); c.globalCompositeOperation = st.erase ? 'destination-out' : 'source-over';
  c.strokeStyle=c.fillStyle=st.color; c.lineCap='round'; c.lineJoin='round';
  const p=st.pts, w=pr=>st.size*(0.35+pr*1.3);
  if(p.length===1){ c.beginPath(); c.arc(p[0][0],p[0][1],w(p[0][2])/2,0,Math.PI*2); c.fill(); }
  for(let i=1;i<p.length;i++){ c.lineWidth=w(p[i][2]); c.beginPath(); c.moveTo(p[i-1][0],p[i-1][1]); c.lineTo(p[i][0],p[i][1]); c.stroke(); }
  c.restore();
}
function drawSticker(c,k){
  c.save(); c.translate(k.x,k.y); c.rotate(k.rot); c.font=`${110*k.sc}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  c.textAlign='center'; c.textBaseline='middle'; c.fillText(k.e,0,8*k.sc); c.restore();
}
function render(){
  if(!ctx) return;
  const W=cv.width, H=cv.height;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#14171c'; ctx.fillRect(0,0,W,H);
  setT(ctx); ctx.fillStyle='#ffffff';
  for (const s of SURFACES){ ctx.beginPath(); surfPath(ctx,s); ctx.fill(); }
  // Design layer: strokes + stickers, clipped to Surfaces via the mask
  lctx.setTransform(1,0,0,1,0,0); lctx.clearRect(0,0,W,H); setT(lctx);
  S.strokes.forEach(st=>drawStroke(lctx,st));
  S.stickers.forEach(k=>drawSticker(lctx,k));
  lctx.setTransform(1,0,0,1,0,0); lctx.globalCompositeOperation='destination-in'; lctx.drawImage(mask,0,0); lctx.globalCompositeOperation='source-over';
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(layer,0,0);
  // outlines on top so the Surfaces stay readable
  setT(ctx); ctx.strokeStyle='rgba(120,135,155,.55)'; ctx.lineWidth=2/view.s*dpr;
  for (const s of SURFACES){ ctx.beginPath(); surfPath(ctx,s); ctx.stroke(); }
  if (S.selected>=0 && S.stickers[S.selected]) {
    const k=S.stickers[S.selected]; ctx.setLineDash([10/view.s*dpr,8/view.s*dpr]); ctx.strokeStyle='#4fc3f7'; ctx.lineWidth=3/view.s*dpr;
    ctx.beginPath(); ctx.arc(k.x,k.y,62*k.sc,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  }
  placeStickerBar(); updateDebug();
}

/* ======================= Input ======================= */
function toDesign(e){ const r=cv.getBoundingClientRect(); return [((e.clientX-r.left)*dpr-view.ox)/view.s, ((e.clientY-r.top)*dpr-view.oy)/view.s]; }
function pres(e){ S.lastPointer={type:e.pointerType, pressure:+e.pressure.toFixed(2)}; return e.pointerType==='pen' ? Math.max(0.05,e.pressure) : 0.5; }
function hitSticker(x,y){ for(let i=S.stickers.length-1;i>=0;i--){ const k=S.stickers[i]; if(Math.hypot(x-k.x,y-k.y)<62*k.sc) return i; } return -1; }
let drag=null, cur=null;
function attachCanvas(){
  cv.addEventListener('pointerdown', e=>{
    poke(); cv.setPointerCapture(e.pointerId); const [x,y]=toDesign(e), p=pres(e);
    if (S.mode==='sticker') {
      const hit=hitSticker(x,y);
      if (hit>=0){ snapshot(); S.selected=hit; const k=S.stickers[hit]; drag={type:'move',dx:x-k.x,dy:y-k.y}; }
      else if (S.pendingSticker){ snapshot(); S.stickers.push({e:S.pendingSticker,x,y,sc:1,rot:0}); S.selected=S.stickers.length-1; drag={type:'move',dx:0,dy:0}; }
      else S.selected=-1;
    } else {
      snapshot(); S.selected=-1; cur={color:S.color,size:S.size,erase:S.tool==='eraser',pts:[[x,y,p]]}; S.strokes.push(cur); drag={type:'draw'};
    }
    render();
  });
  cv.addEventListener('pointermove', e=>{
    if(!drag) { if(e.pointerType==='pen') pres(e), updateDebug(); return; }
    poke(); const [x,y]=toDesign(e), p=pres(e);
    if (drag.type==='draw') cur.pts.push([x,y,p]);
    else { const k=S.stickers[S.selected]; k.x=x-drag.dx; k.y=y-drag.dy; }
    render();
  });
  const end=()=>{ drag=null; cur=null; };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
}

/* ======================= Shared UI helpers ======================= */
const swatches = cls => COLORS.map(c=>`<button class="swatch ${cls||''}" data-color="${c}" style="background:${c}" title="${c}"></button>`).join('');
const stickerBtns = list => list.map(e=>`<button class="stk" data-sticker="${e}">${e}</button>`).join('');

document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return; poke();
  const d=b.dataset;
  if (d.color){ S.color=d.color; S.tool='pen'; S.mode='draw'; S.pendingSticker=null; S.selected=-1; }
  else if (d.size){ S.size=+d.size; S.mode='draw'; S.pendingSticker=null; if(S.tool!=='eraser') S.tool='pen'; }
  else if (d.tool){ S.tool=d.tool; S.mode='draw'; S.pendingSticker=null; S.selected=-1; }
  else if (d.sticker){ S.pendingSticker=d.sticker; S.mode='sticker'; S.drawerOpen=false; }
  else if (d.mode){ S.mode=d.mode; if(d.mode==='draw'){ S.pendingSticker=null; S.selected=-1; } }
  else if (d.act==='undo') undo();
  else if (d.act==='clear'){ if(!isEmpty()){ snapshot(); S.strokes=[]; S.stickers=[]; S.selected=-1; } }
  else if (d.act==='done') return finish();
  else if (d.act==='drawer'){ S.drawerOpen=!S.drawerOpen; }
  else if (d.act==='next'){ S.step=Math.min(STEPS.length-1,S.step+1); return build(); }
  else if (d.act==='back'){ S.step=Math.max(0,S.step-1); return build(); }
  else if (d.step!==undefined){ S.step=+d.step; return build(); }
  else if (d.st && S.selected>=0){
    const k=S.stickers[S.selected]; snapshot();
    if(d.st==='bigger') k.sc=Math.min(4,k.sc*1.2); if(d.st==='smaller') k.sc=Math.max(.3,k.sc/1.2);
    if(d.st==='rotl') k.rot-=Math.PI/12; if(d.st==='rotr') k.rot+=Math.PI/12;
    if(d.st==='del'){ S.stickers.splice(S.selected,1); S.selected=-1; }
  }
  syncActive(); render();
});
function syncActive(){
  document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active', S.mode==='draw'&&S.tool==='pen'&&b.dataset.color===S.color));
  document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active', +b.dataset.size===S.size));
  document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active', S.mode==='draw'&&b.dataset.tool===S.tool));
  document.querySelectorAll('[data-sticker]').forEach(b=>b.classList.toggle('active', S.mode==='sticker'&&b.dataset.sticker===S.pendingSticker));
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active', b.dataset.mode===S.mode));
  const dr=document.querySelector('.drawer'); if(dr) dr.classList.toggle('open', S.drawerOpen);
}
function placeStickerBar(){
  const bar=document.getElementById('stbar'); const k=S.stickers[S.selected];
  if(!k || S.mode!=='sticker'){ bar.style.display='none'; return; }
  const r=cv.getBoundingClientRect();
  bar.style.display='flex';
  bar.style.left=(r.left+(view.ox+k.x*view.s)/dpr)+'px';
  bar.style.top=(r.top+(view.oy+(k.y+70*k.sc)*view.s)/dpr)+'px';
}

/* ======================= Variants ======================= */
function variantA(){ return `
<div class="vA">
  <header>☃️ Decorate the snowman!</header>
  <div class="rail">
    <div class="lbl">Tool</div>
    <button data-tool="pen">✏️ Pen</button>
    <button data-tool="eraser">🧽 Eraser</button>
    <div class="lbl">Size</div>
    ${SIZES.map((s,i)=>`<button data-size="${s}">${['Thin','Medium','Thick'][i]}</button>`).join('')}
    <div class="lbl">Colour</div>
    <div class="colors">${swatches()}</div>
    <div class="lbl">Edit</div>
    <button data-act="undo">↶ Undo</button>
    <button data-act="clear">🗑 Clear</button>
  </div>
  <div class="host"><canvas></canvas></div>
  <div class="tray">
    ${Object.entries(STICKERS).map(([cat,l])=>`<h3>${cat}</h3><div class="grid">${stickerBtns(l)}</div>`).join('')}
    <button class="done" data-act="done">✔ Done</button>
  </div>
</div>`; }

function variantB(){ return `
<div class="vB">
  <div class="host"><canvas></canvas></div>
  <div class="topl"><button data-act="undo" title="Undo">↶</button><button data-act="clear" title="Clear all">🗑</button></div>
  <button class="done" data-act="done">Done ✔</button>
  <div class="dock">
    ${swatches()}
    <div class="sep"></div>
    <button class="round" data-tool="eraser" title="Eraser">🧽</button>
    ${SIZES.map(s=>`<button class="sz" data-size="${s}"><i style="width:${8+s/1.3}px;height:${8+s/1.3}px"></i></button>`).join('')}
    <div class="sep"></div>
    <button class="big" data-act="drawer">⭐ Stickers</button>
  </div>
  <div class="drawer">
    <div class="row"><span>Pick a sticker, then tap the snowman</span><button data-act="drawer" style="width:56px;height:56px;border-radius:50%;font-size:24px">✕</button></div>
    <div class="grid">${stickerBtns(ALL_STICKERS)}</div>
  </div>
</div>`; }

function variantC(){
  const st=STEPS[S.step], last=S.step===STEPS.length-1;
  const list = st.cat ? STICKERS[st.cat] : ALL_STICKERS;
  return `
<div class="vC">
  <div class="steps">${STEPS.map((x,i)=>`<button data-step="${i}" class="${i===S.step?'active':''} ${i<S.step?'past':''}"><b>${i<S.step?'✓':i+1}</b>${x.name}</button>`).join('')}</div>
  <div class="host"><canvas></canvas><div class="prompt">${st.prompt}</div></div>
  <div class="strip">
    <div class="seg"><button data-mode="draw">✏️ Draw</button><button data-mode="sticker">⭐ Stickers</button></div>
    ${S.mode==='draw'
      ? `${swatches()}<button class="small" data-tool="eraser">🧽 Eraser</button>${SIZES.map((s,i)=>`<button class="small" data-size="${s}">${['S','M','L'][i]}</button>`).join('')}`
      : stickerBtns(list)}
    <button class="small" data-act="undo">↶ Undo</button>
  </div>
  <div class="nav">
    <button data-act="back" ${S.step===0?'style="visibility:hidden"':''}>← Back</button>
    ${last ? `<button class="finish" data-act="done">✔ Finish</button>` : `<button class="next" data-act="next">Next: ${STEPS[S.step+1].name} →</button>`}
  </div>
</div>`; }

function build(){
  const app=document.getElementById('app');
  app.innerHTML = {A:variantA,B:variantB,C:variantC}[S.variant]();
  host=app.querySelector('.host'); cv=host.querySelector('canvas'); ctx=cv.getContext('2d');
  layer=document.createElement('canvas'); lctx=layer.getContext('2d');
  mask=document.createElement('canvas'); mctx=mask.getContext('2d');
  attachCanvas(); syncActive();
  document.getElementById('vlabel').textContent = `${S.variant} · ${VARIANTS[S.variant]}`;
  requestAnimationFrame(fit);
}
// Variant C rebuilds its strip when the mode changes
document.addEventListener('click', e=>{ if(S.variant==='C' && e.target.closest('[data-mode],[data-sticker],[data-color],[data-tool]') && e.target.closest('.seg')) build(); });

/* ======================= Switcher ======================= */
function setVariant(v){ S.variant=v; S.step=0; S.drawerOpen=false; const u=new URL(location); u.searchParams.set('variant',v); history.replaceState(null,'',u); build(); }
const keys=Object.keys(VARIANTS);
const cycle=d=>setVariant(keys[(keys.indexOf(S.variant)+d+keys.length)%keys.length]);
document.getElementById('prev').onclick=e=>{ e.stopPropagation(); cycle(-1); };
document.getElementById('next').onclick=e=>{ e.stopPropagation(); cycle(1); };
document.addEventListener('keydown', e=>{
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key==='ArrowLeft') cycle(-1); if (e.key==='ArrowRight') cycle(1);
  if (e.key==='d' || e.key==='D') { const d=document.getElementById('debug'); d.style.display = d.style.display==='none' ? '' : 'none'; }
});
window.addEventListener('resize', fit);

/* ======================= Done & idle ======================= */
const overlay=document.getElementById('overlay');
function showOverlay(html){ overlay.innerHTML=html; overlay.style.display='grid'; }
function hideOverlay(){ overlay.style.display='none'; }
function finish(){
  showOverlay(`<div>✨ Thanks! Your snowman was saved.<small>(prototype: nothing is saved) — next visitor in a moment…</small></div>`);
  setTimeout(()=>{ hideOverlay(); resetDesign(); }, 2500);
}
function poke(){ S.lastInput=Date.now(); if(S.idleWarn){ S.idleWarn=false; hideOverlay(); } }
overlay.addEventListener('pointerdown', ()=>{ if(S.idleWarn) poke(); });
setInterval(()=>{
  const idle=(Date.now()-S.lastInput)/1000;
  if (!isEmpty() && idle>IDLE) {
    const left=Math.ceil(IDLE+10-idle);
    if (left<=0){ S.idleWarn=false; hideOverlay(); resetDesign(); S.lastInput=Date.now(); }
    else { S.idleWarn=true; showOverlay(`<div>Still decorating? ☃️<small>Tap anywhere to keep going — starting over in ${left}s</small></div>`); }
  }
  updateDebug();
}, 1000);

function updateDebug(){
  const idle=Math.round((Date.now()-S.lastInput)/1000);
  document.getElementById('debug').textContent =
`PROTOTYPE state (D toggles)
variant ${S.variant}${S.variant==='C'?` step ${S.step} ${STEPS[S.step].name}`:''}
mode ${S.mode}  tool ${S.tool}  color ${S.color}  size ${S.size}
sticker ${S.pendingSticker||'-'}  selected ${S.selected}
strokes ${S.strokes.length}  stickers ${S.stickers.length}  undo ${S.history.length}
pointer ${S.lastPointer.type}  pressure ${S.lastPointer.pressure}
idle ${idle}s / reset after ${IDLE}s+10s`;
}

build();
</script>
</body>
</html>
